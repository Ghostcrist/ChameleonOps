[defaults]
inventory = ./hosts
roles_path = ./roles
remote_user = ansible
host_key_checking = True
timeout = 25
forks = 3
interpreter_python = auto_silent

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
# Tras comprobar sudo en los tres destinos, se puede evaluar:
# pipelining = True
