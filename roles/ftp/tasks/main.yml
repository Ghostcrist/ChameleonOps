---
- name: Instalar servidor vsftpd
  ansible.builtin.package:
    name:
      - vsftpd
      - ftp
    state: present

- name: Desplegar plantilla vsftpd.conf
  ansible.builtin.template:
    src: vsftpd.conf.j2
    dest: /etc/vsftpd.conf
    owner: root
    group: root
    mode: '0600'
  notify: Reiniciar vsftpd

- name: Abrir servicio FTP en el firewall
  ansible.posix.firewalld:
    service: ftp
    permanent: true
    state: enabled
    immediate: true

- name: Habilitar e iniciar servicio vsftpd
  ansible.builtin.service:
    name: vsftpd
    state: started
    enabled: true
