---
- name: Instalar PostgreSQL
  community.general.zypper:
    name:
      - postgresql-server
      - postgresql-contrib
    state: present

- name: Iniciar PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

- name: Configurar listen_addresses
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: '^#?listen_addresses'
    line: "listen_addresses = '*'"

- name: Comentar peer
  ansible.builtin.replace:
    path: /var/lib/pgsql/data/pg_hba.conf
    regexp: '^local\s+all\s+all\s+peer'
    replace: '#local   all   all   peer'

- name: Agregar md5 local
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/pg_hba.conf
    insertafter: '^#local\s+all\s+all\s+peer'
    line: 'local   all   all   md5'

- name: Comentar ident
  ansible.builtin.replace:
    path: /var/lib/pgsql/data/pg_hba.conf
    regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32\s+ident'
    replace: '#host   all   all   127.0.0.1/32   ident'

- name: Agregar md5 host
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/pg_hba.conf
    insertafter: '^#host\s+all\s+all\s+127\.0\.0\.1/32\s+ident'
    line: 'host   all   all   127.0.0.1/32   md5'

- name: Reiniciar PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    state: restarted

- name: Cambiar contraseña de postgres
  become_user: postgres
  shell: |
    psql -c "ALTER USER postgres WITH PASSWORD 'mundolibre';"
  changed_when: false

- name: Crear base de datos prueba
  become_user: postgres
  shell: |
    psql -tc "SELECT 1 FROM pg_database WHERE datname='prueba'" | grep -q 1 || psql -c "CREATE DATABASE prueba;"

- name: Instalar Apache y PHP
  community.general.zypper:
    name:
      - apache2
      - php8
      - apache2-mod_php8
      - php8-pgsql
      - php8-mbstring
      - unzip
      - git
    state: present

- name: Iniciar Apache
  ansible.builtin.systemd:
    name: apache2
    state: started
    enabled: true
