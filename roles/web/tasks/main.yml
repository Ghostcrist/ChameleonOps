---
- name: Instalacion de Apache, PHP y phpMyAdmin
  zypper:
    name:
      - apache2
      - php8
      - apache2-mod_php8
      - phpMyAdmin
    state: present

- name: Iniciar y habilitar Apache2
  service:
    name: apache2
    state: started
    enabled: true

- name: Abrir puerto HTTP en el Firewall
  command: firewall-cmd --add-service=http --permanent
  register: firewall_result
  changed_when: "'ALREADY_ENABLED' not in firewall_result.stderr"
  ignore_errors: true

- name: Recargar Firewall
  command: firewall-cmd --reload
  changed_when: false
  ignore_errors: true
