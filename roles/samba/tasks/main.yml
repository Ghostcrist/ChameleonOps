---
- name: Instalar paquetes de Samba
  ansible.builtin.package:
    name:
      - samba
      - samba-client
    state: present

- name: Crear grupo de sistema para Samba
  ansible.builtin.group:
    name: "{{ samba_user }}"
    state: present

- name: Crear usuario Linux para Samba
  ansible.builtin.user:
    name: "{{ samba_user }}"
    group: "{{ samba_user }}"
    shell: /sbin/nologin
    create_home: no

- name: Crear directorio del recurso compartido
  ansible.builtin.file:
    path: "{{ samba_share_path }}"
    state: directory
    owner: "{{ samba_user }}"
    group: "{{ samba_user }}"
    mode: '0770'

- name: Crear usuario y contrasena en Samba
  ansible.builtin.shell: >
    (echo "{{ samba_password }}"; echo "{{ samba_password }}") | smbpasswd -s -a {{ samba_user }}
  register: smb_pass_result
  changed_when: "'Added user' in smb_pass_result.stdout or 'Updated password' in smb_pass_result.stdout"

- name: Desplegar configuracion smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar servicio Samba

- name: Habilitar e iniciar servicio smb
  ansible.builtin.service:
    name: smb
    state: started
    enabled: true
