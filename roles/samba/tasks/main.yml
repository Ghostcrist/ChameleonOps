---
- name: Instalacion del servicio Samba
  zypper:
    name: samba
    state: present

- name: Asegurar directorio compartido
  file:
    path: /srv/samba/compartido
    state: directory
    mode: '0777'

- name: Iniciar y habilitar Samba
  service:
    name: smb
    state: started
    enabled: true
